# =========================================================================
# Traefik v3.2 - Configuración Estática Principal para VPS Hardened
# =========================================================================

global:
  checkNewVersion: false
  sendAnonymousUsage: false

# Niveles y Destinos de Bitácora
log:
  level: INFO
  format: json
  filePath: /var/log/traefik/traefik.log

# Logs de Acceso en formato JSON para análisis en tiempo real por CrowdSec (WAF/IPS)
accessLog:
  filePath: /var/log/traefik/access.log
  format: json
  bufferingSize: 50
  filters:
    statusCodes:
      - "200-299"
      - "400-599"

# Panel de Control Administrativo (Protegido / Local)
api:
  dashboard: true
  insecure: true

# Sonda interna de salud para Healthcheck
ping:
  entryPoint: traefik

# Puntos de Entrada de Red
# NOTA DE SEGURIDAD: Cuando el módulo Ops está activo, el protocolo HTTP (:80)
# queda COMPLETAMENTE DESACTIVADO para garantizar que el único ingreso sea HTTPS (:443).
entryPoints:
  traefik:
    address: ":8080"

  websecure:
    address: ":443"
    http:
      tls:
        certResolver: letsencrypt
        domains:
          - main: "${DOMAIN_NAME:-bevadmin.com}"
            sans:
              - "*.${DOMAIN_NAME:-bevadmin.com}"

# Proveedores de Configuración
providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    network: "bevadmin-network"
    watch: true

  file:
    directory: "/etc/traefik/dynamic"
    watch: true

# Proveedor Automático de Certificados SSL/TLS (Let's Encrypt ACME)
# Utiliza TLS-ALPN-01 (tlsChallenge en puerto 443) sin requerir el puerto HTTP :80
certificatesResolvers:
  letsencrypt:
    acme:
      email: "${ACME_EMAIL:-admin@bevadmin.com}"
      storage: "/etc/traefik/acme/acme.json"
      tlsChallenge: {}
