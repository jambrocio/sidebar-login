# =========================================================================
# Traefik v3.2 - Middlewares de Seguridad Perimetral y Rendimiento (OWASP)
# =========================================================================

http:
  middlewares:
    # 1. Cabeceras de Seguridad Estrictas (Anti-Clickjacking, Anti-Sniffing, HSTS)
    secHeaders:
      headers:
        stsSeconds: 0
        stsIncludeSubdomains: false
        stsPreload: false
        forceSTSHeader: false
        contentTypeNosniff: true
        browserXssFilter: true
        customFrameOptionsValue: "SAMEORIGIN"
        referrerPolicy: "strict-origin-when-cross-origin"
        permissionsPolicy: "camera=(), microphone=(), geolocation=(), payment=()"
        customResponseHeaders:
          X-Robots-Tag: "noindex, nofollow"
          Server: ""

    # 2. Limitación de Tasa (Rate Limiting contra ataques DoS y fuerza bruta)
    rateLimit:
      rateLimit:
        average: 120
        burst: 60
        period: 1m

    # 3. Compresión Dinámica de Tráfico (Gzip / Brotli)
    compression:
      compress:
        minResponseBodyBytes: 1024

    # 4. Cadena de Seguridad Completa Reutilizable
    securedChain:
      chain:
        middlewares:
          - secHeaders
          - rateLimit
          - compression


