<section class="page-wrapper">
  <header class="page-header">
    <div>
      <h1>Nueva Categoría de Productos</h1>
      <p class="subtitle">
        Negocio: <strong>{{ businessInfo().legalName }}</strong>
      </p>
    </div>

    <div class="header-actions">
      <a routerLink="/dashboard/categories" class="btn-secondary">
        <i class="bi bi-list-task"></i>
        <span>Listar Categorías</span>
      </a>
    </div>
  </header>

  <div
    *ngIf="feedbackMessage()"
    class="feedback-banner"
    [ngClass]="'feedback-' + feedbackMessage()?.type"
    role="status"
  >
    <i
      class="bi"
      [ngClass]="{
        'bi-check-circle-fill': feedbackMessage()?.type === 'success',
        'bi-exclamation-triangle-fill': feedbackMessage()?.type === 'warning',
        'bi-x-circle-fill': feedbackMessage()?.type === 'error',
        'bi-info-circle-fill': feedbackMessage()?.type === 'info'
      }"
    ></i>
    <span>{{ feedbackMessage()?.text }}</span>
  </div>

  <div class="card form-card">
    <h2 class="section-title">Registrar Nueva Categoría de Productos</h2>
    <form (ngSubmit)="saveCategory()" class="grid-form">
      <div class="form-group">
        <label>
          Negocio Matriz <span class="required-indicator">*</span>
          <span *ngIf="!isGeneralAdmin()" style="font-size: 0.75rem; color: #0284c7">(Por default)</span>
        </label>
        <select
          name="catBusiness"
          [(ngModel)]="newCategory.businessCode"
          [disabled]="!isGeneralAdmin()"
          required
          class="required-input"
        >
          <option *ngFor="let b of availableBusinesses()" [value]="b.id">
            {{ b.id }} — {{ b.commercialName || b.legalName }}
          </option>
        </select>
      </div>

      <div class="form-group">
        <label>Nombre de la Categoría <span class="required-indicator">*</span></label>
        <input
          type="text"
          name="catName"
          [(ngModel)]="newCategory.name"
          placeholder="Ej. Energizantes e Hidratantes"
          required
          class="required-input"
        />
      </div>
      <div class="form-group">
        <label>Slug URL</label>
        <input
          type="text"
          name="catSlug"
          [(ngModel)]="newCategory.slug"
          placeholder="energizantes-hidratantes"
        />
      </div>
      <div class="form-group full-width">
        <label>Margen Mayorista Objetivo</label>
        <input type="text" name="catMargin" [(ngModel)]="newCategory.wholesaleMargin" />
      </div>
      <div class="form-actions full-width">
        <button type="submit" class="btn-primary">
          <i class="bi bi-folder-plus"></i>
          <span>Crear Línea</span>
        </button>
      </div>
    </form>
  </div>
</section>
