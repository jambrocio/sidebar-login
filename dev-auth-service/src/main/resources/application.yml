server:
  port: 8081
  forward-headers-strategy: framework
  servlet:
    context-path: /

spring:
  application:
    name: auth-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  main:
    web-application-type: servlet

  threads:
    virtual:
      enabled: true

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/admin_dashboard_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      pool-name: AuthHikariPool
      connection-init-sql: "SET search_path TO auth, rbac, core, public;"

# Security, Cryptography & Token Configuration
auth:
  security:
    jwt:
      issuer: "https://auth.enterprise.internal"
      access-token-expiration-minutes: 30
      refresh-token-expiration-days: 7
      key-id: "auth-key-v1"
      algorithm: "RS256"
    lockout:
      max-failed-attempts: 5
    password:
      expiration-days: 90
      warning-threshold-days: 7
    cors:
      allowed-origins:
        - "http://localhost:4200"
        - "http://localhost:3000"
        - "http://localhost:8080"
        - "http://127.0.0.1:4200"
        - "https://localhost"

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      show-details: always
