# ==============================================================================
# BevAdmin Pro - Módulo Operativo Independiente (VPS Hardened)
# Seguridad Web (WAF + TLS 1.3), Monitoreo "Alert-on-Down" y Resiliencia
# ==============================================================================
# Este archivo opera de forma 100% independiente de 'docker-compose.yml'.
# Conecta a los servicios de la aplicación a través de la red compartida:
# 'bevadmin-network'
#
# Para iniciar:
#   docker compose -f docker-compose.ops.yml up -d
# ==============================================================================

name: bevadmin-ops

services:
  # ----------------------------------------------------------------------------
  # 1. Reverse Proxy WAF con SSL Automático Let's Encrypt (Traefik v3.2)
  # ----------------------------------------------------------------------------
  bevadmin-proxy:
    image: traefik:v3.2
    container_name: bevadmin-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "127.0.0.1:8088:8080"
    environment:
      - DOMAIN_NAME=${DOMAIN_NAME:-bevadmin.com}
      - ACME_EMAIL=${ACME_EMAIL:-admin@bevadmin.com}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./ops/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./ops/traefik/dynamic:/etc/traefik/dynamic:ro
      - traefik-acme:/etc/traefik/acme
      - traefik-logs:/var/log/traefik
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 15s
      timeout: 3s
      retries: 3
    networks:
      - bevadmin-network

  # ----------------------------------------------------------------------------
  # 2. WAF & Sistema de Prevención de Intrusiones (CrowdSec IDS/IPS)
  # ----------------------------------------------------------------------------
  bevadmin-crowdsec:
    image: crowdsecurity/crowdsec:latest
    container_name: bevadmin-crowdsec
    restart: unless-stopped
    environment:
      - COLLECTIONS=crowdsecurity/traefik crowdsecurity/http-cve crowdsecurity/base-http-scenarios crowdsecurity/whitelist-good-actors
    volumes:
      - ./ops/crowdsec/acquis.yaml:/etc/crowdsec/acquis.yaml:ro
      - crowdsec-data:/var/lib/crowdsec/data
      - crowdsec-config:/etc/crowdsec
      - traefik-logs:/var/log/traefik:ro
    depends_on:
      bevadmin-proxy:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "cscli version || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - bevadmin-network

  # ----------------------------------------------------------------------------
  # 3. Monitoreo Inteligente de Disponibilidad (Uptime Kuma - "Alert-on-Down")
  # ----------------------------------------------------------------------------
  bevadmin-uptime-kuma:
    image: louislam/uptime-kuma:latest
    container_name: bevadmin-uptime-kuma
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - uptime-kuma-data:/app/data
    healthcheck:
      test: ["CMD", "node", "extra/healthcheck.js"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - bevadmin-network

  # ----------------------------------------------------------------------------
  # 4. Watchdog de Auto-Recuperación de Contenedores (Autoheal)
  # ----------------------------------------------------------------------------
  bevadmin-autoheal:
    image: willfarrell/autoheal:latest
    container_name: bevadmin-autoheal
    restart: unless-stopped
    environment:
      - AUTOHEAL_CONTAINER_LABEL=autoheal
      - AUTOHEAL_INTERVAL=15
      - AUTOHEAL_START_PERIOD=30
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - bevadmin-network

  # ----------------------------------------------------------------------------
  # 5. Respaldos Cifrados Automatizados de Base de Datos (PostgreSQL Backup)
  # ----------------------------------------------------------------------------
  bevadmin-db-backup:
    image: prodrigestivill/postgres-backup-local:17
    container_name: bevadmin-db-backup
    restart: unless-stopped
    environment:
      - POSTGRES_HOST=dev-postgres
      - POSTGRES_DB=${DB_NAME:-admin_dashboard_db}
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-postgres}
      - SCHEDULE=@daily
      - BACKUP_KEEP_DAYS=7
      - BACKUP_KEEP_WEEKS=4
      - BACKUP_KEEP_MONTHS=6
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h dev-postgres -U ${DB_USER:-postgres} -d ${DB_NAME:-admin_dashboard_db} || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    volumes:
      - postgres-backups:/backups
    networks:
      - bevadmin-network

volumes:
  traefik-acme:
    name: bevadmin_traefik_acme
  traefik-logs:
    name: bevadmin_traefik_logs
  crowdsec-data:
    name: bevadmin_crowdsec_data
  crowdsec-config:
    name: bevadmin_crowdsec_config
  uptime-kuma-data:
    name: bevadmin_uptime_kuma_data
  postgres-backups:
    name: bevadmin_postgres_backups

networks:
  bevadmin-network:
    name: bevadmin-network
    external: true
