# ==============================================================================
# PERFIL DE AMBIENTE: QA (TESTING / CONTROL DE CALIDAD)
# ==============================================================================
server:
  port: 8080

spring:
  config:
    activate:
      on-profile: qa
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/admin_dashboard_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    show-sql: false

logging:
  level:
    root: INFO
    com.elroble.bevadmin: INFO

bevadmin:
  environment: qa
  security:
    jwt:
      secret: ${JWT_SECRET:ElRobleBebidasMayorYMenorClaveSecretaCorporativa2026SpringSecurity7Key}
      access-token-expiration-minutes: 30
      refresh-token-expiration-days: 7
    cors:
      allowed-origins:
        - "http://localhost:4200"
        - "http://127.0.0.1:4200"
