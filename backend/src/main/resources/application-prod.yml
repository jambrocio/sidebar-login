# ==============================================================================
# PERFIL DE AMBIENTE: PRODUCCIÓN (PROD)
# ==============================================================================
server:
  port: 8080
  forward-headers-strategy: framework

spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/admin_dashboard_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    show-sql: false

logging:
  level:
    root: WARN
    com.elroble.bevadmin: INFO

bevadmin:
  environment: produccion
  security:
    jwt:
      secret: ${JWT_SECRET:ElRobleBebidasMayorYMenorClaveSecretaCorporativa2026SpringSecurity7Key}
      access-token-expiration-minutes: 30
      refresh-token-expiration-days: 7
    cors:
      allowed-origins:
        - "http://localhost:4200"
        - "http://127.0.0.1:4200"
        - "https://localhost"
        - "https://127.0.0.1"
        - "http://localhost"
        - "https://app.bevadmin.com"
        - "http://app.bevadmin.com"
