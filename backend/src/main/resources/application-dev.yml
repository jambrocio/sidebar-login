# ==============================================================================
# PERFIL DE AMBIENTE: DESARROLLO (DEV)
# ==============================================================================
server:
  port: 8080

spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/admin_dashboard_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    root: INFO
    com.elroble.bevadmin: DEBUG
    org.springframework.security: INFO

bevadmin:
  environment: desarrollo
  security:
    jwt:
      secret: ${JWT_SECRET:ElRobleBebidasMayorYMenorClaveSecretaCorporativa2026SpringSecurity7Key}
      access-token-expiration-minutes: 60
      refresh-token-expiration-days: 7
    cors:
      allowed-origins:
        - "http://localhost:4200"
        - "http://127.0.0.1:4200"
