<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visor de Diagramas Técnicos y Arquitectura — BevAdmin Pro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    :root {
      --bg: #0b0f19;
      --sidebar-bg: #111827;
      --card-border: #1f2937;
      --primary: #38bdf8;
      --primary-dark: #0284c7;
      --accent: #818cf8;
      --success: #34d399;
      --amber: #fbbf24;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* SIDEBAR NAVIGATION */
    aside {
      width: 340px;
      background-color: var(--sidebar-bg);
      border-right: 1px solid var(--card-border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      z-index: 20;
    }

    .brand-box {
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      align-items: center;
      gap: 0.85rem;
    }

    .brand-icon {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: linear-gradient(135deg, #0284c7, #6366f1);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
      color: #fff;
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.3);
    }

    .brand-title {
      font-size: 1.05rem;
      font-weight: 800;
      color: #fff;
      letter-spacing: -0.02em;
    }

    .brand-sub {
      font-size: 0.72rem;
      color: var(--primary);
      font-family: 'JetBrains Mono', monospace;
      font-weight: 600;
    }

    .menu-header {
      padding: 1rem 1.5rem 0.5rem;
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
    }

    .diagram-list {
      flex: 1;
      overflow-y: auto;
      padding: 0.5rem 0.85rem;
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    .diagram-item {
      display: flex;
      align-items: flex-start;
      gap: 0.85rem;
      padding: 0.85rem 1rem;
      border-radius: 0.75rem;
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-muted);
      cursor: pointer;
      text-align: left;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      width: 100%;
    }

    .diagram-item:hover {
      background: rgba(255, 255, 255, 0.04);
      color: #fff;
      border-color: rgba(255, 255, 255, 0.08);
    }

    .diagram-item.active {
      background: rgba(56, 189, 248, 0.12);
      border-color: rgba(56, 189, 248, 0.35);
      color: #fff;
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.15);
    }

    .item-icon {
      font-size: 1.25rem;
      margin-top: 0.1rem;
      color: var(--text-muted);
      transition: color 0.2s;
    }

    .diagram-item.active .item-icon {
      color: var(--primary);
    }

    .item-content {
      flex: 1;
    }

    .item-title {
      font-size: 0.88rem;
      font-weight: 700;
      line-height: 1.3;
      margin-bottom: 0.2rem;
    }

    .item-badge {
      font-size: 0.65rem;
      font-family: 'JetBrains Mono', monospace;
      padding: 0.15rem 0.45rem;
      border-radius: 4px;
      font-weight: 700;
      text-transform: uppercase;
      display: inline-block;
    }

    .badge-arch { background: rgba(56, 189, 248, 0.2); color: #38bdf8; }
    .badge-seq  { background: rgba(129, 140, 248, 0.2); color: #818cf8; }
    .badge-flow { background: rgba(52, 211, 153, 0.2); color: #34d399; }
    .badge-erd  { background: rgba(251, 191, 36, 0.2); color: #fbbf24; }

    .sidebar-footer {
      padding: 1rem 1.5rem;
      border-top: 1px solid var(--card-border);
      font-size: 0.75rem;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* MAIN VIEWPORT */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      background: #030712;
    }

    .toolbar {
      padding: 0.75rem 1.5rem;
      background: rgba(17, 24, 39, 0.85);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--card-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-shrink: 0;
    }

    .current-info {
      display: flex;
      align-items: center;
      gap: 0.85rem;
    }

    .current-title {
      font-size: 1rem;
      font-weight: 700;
      color: #fff;
    }

    .current-desc {
      font-size: 0.8rem;
      color: var(--text-muted);
      border-left: 1px solid var(--card-border);
      padding-left: 0.85rem;
      display: none;
    }

    @media (min-width: 900px) {
      .current-desc { display: inline-block; }
    }

    .toolbar-actions {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .btn-tool {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 0.45rem 0.85rem;
      border-radius: 0.5rem;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      transition: all 0.15s ease;
      text-decoration: none;
    }

    .btn-tool:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.2);
    }

    .viewer-container {
      flex: 1;
      width: 100%;
      height: calc(100vh - 60px);
      position: relative;
      background: #030712;
    }

    iframe#diagramFrame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background: transparent;
    }

    /* Mobile toggle */
    .mobile-menu-btn {
      display: none;
      background: transparent;
      border: none;
      color: #fff;
      font-size: 1.35rem;
      cursor: pointer;
    }

    @media (max-width: 768px) {
      aside {
        position: fixed;
        left: -340px;
        top: 0;
        bottom: 0;
        transition: left 0.3s ease;
      }
      aside.open { left: 0; }
      .mobile-menu-btn { display: inline-block; }
    }
  </style>
</head>
<body>
  <!-- MENÚ LATERAL INTERACTIVO -->
  <aside id="sidebar">
    <div class="brand-box">
      <div class="brand-icon">
        <i class="bi bi-diagram-3-fill"></i>
      </div>
      <div>
        <div class="brand-title">BevAdmin Pro</div>
        <div class="brand-sub">ARCHIFY SHOWCASE v3.2</div>
      </div>
    </div>

    <div class="menu-header">Catálogo de Diagramas Técnicos</div>

    <div class="diagram-list" id="diagramList">
      <!-- Item 1 -->
      <button class="diagram-item active" onclick="selectDiagram(0)">
        <i class="bi bi-boxes item-icon"></i>
        <div class="item-content">
          <div class="item-title">01. Arquitectura C4 Contenedores</div>
          <span class="item-badge badge-arch">Architecture</span>
        </div>
      </button>

      <!-- Item 2 -->
      <button class="diagram-item" onclick="selectDiagram(1)">
        <i class="bi bi-receipt item-icon"></i>
        <div class="item-content">
          <div class="item-title">02. Secuencia Venta POS & Cupones</div>
          <span class="item-badge badge-seq">Sequence</span>
        </div>
      </button>

      <!-- Item 3 -->
      <button class="diagram-item" onclick="selectDiagram(2)">
        <i class="bi bi-shield-lock item-icon"></i>
        <div class="item-content">
          <div class="item-title">03. Auditoría NOC & Kill Session</div>
          <span class="item-badge badge-seq">Sequence</span>
        </div>
      </button>

      <!-- Item 4 -->
      <button class="diagram-item" onclick="selectDiagram(3)">
        <i class="bi bi-layout-sidebar-inset item-icon"></i>
        <div class="item-content">
          <div class="item-title">04. Menú Dinámico RBAC Recursivo</div>
          <span class="item-badge badge-seq">Sequence</span>
        </div>
      </button>

      <!-- Item 5 -->
      <button class="diagram-item" onclick="selectDiagram(4)">
        <i class="bi bi-play-circle-fill item-icon"></i>
        <div class="item-content">
          <div class="item-title">05. Flujo Operativo End-to-End</div>
          <span class="item-badge badge-flow">Workflow Trace</span>
        </div>
      </button>

      <!-- Item 6 -->
      <button class="diagram-item" onclick="selectDiagram(5)">
        <i class="bi bi-database-fill-gear item-icon"></i>
        <div class="item-content">
          <div class="item-title">06. Modelo ERD en Español</div>
          <span class="item-badge badge-erd">PostgreSQL 17 ERD</span>
        </div>
      </button>

      <!-- Item 7 -->
      <button class="diagram-item" onclick="selectDiagram(6)">
        <i class="bi bi-shield-check item-icon"></i>
        <div class="item-content">
          <div class="item-title">07. C4: Ops + Frontend + Backend + BD</div>
          <span class="item-badge badge-arch">C4 Model Nivel 2</span>
        </div>
      </button>

      <!-- Item 8 -->
      <button class="diagram-item" onclick="selectDiagram(7)">
        <i class="bi bi-git item-icon"></i>
        <div class="item-content">
          <div class="item-title">08. C4 CI/CD GitHub & Homelab</div>
          <span class="item-badge badge-arch">C4 Model Nivel 2</span>
        </div>
      </button>
    </div>

    <div class="sidebar-footer">
      <span><i class="bi bi-check-circle-fill" style="color: var(--success);"></i> 8 Diagramas Listos</span>
      <span style="font-family: 'JetBrains Mono', monospace;">100% Pasaron Gates</span>
    </div>
  </aside>

  <!-- ÁREA DE VISUALIZACIÓN EN LA MISMA PESTAÑA -->
  <main>
    <div class="toolbar">
      <div class="current-info">
        <button class="mobile-menu-btn" onclick="toggleSidebar()"><i class="bi bi-list"></i></button>
        <span class="item-badge badge-arch" id="currentBadge">Architecture</span>
        <span class="current-title" id="currentTitle">01. Arquitectura Global C4 Contenedores</span>
        <span class="current-desc" id="currentDesc">Red Docker, Angular 21, Spring Boot 4 y PostgreSQL 17</span>
      </div>

      <div class="toolbar-actions">
        <a class="btn-tool" href="../cloud/index.html" style="text-decoration: none;" title="Ver Arquitectura Cloud (Azure & GCP)">
          <i class="bi bi-clouds-fill" style="color: #38bdf8;"></i> Arquitectura Cloud
        </a>
        <a class="btn-tool" href="../presentacion/PRESENTACION_INTERACTIVA_USUARIO.html" style="text-decoration: none;" title="Ver Presentación Comercial Interactiva">
          <i class="bi bi-presentation" style="color: #34d399;"></i> Presentación
        </a>
        <button class="btn-tool" onclick="reloadFrame()" title="Recargar Diagrama">
          <i class="bi bi-arrow-clockwise"></i> Recargar
        </button>
        <button class="btn-tool" onclick="toggleFullscreen()" title="Pantalla Completa">
          <i class="bi bi-fullscreen" id="fsIcon"></i> Pantalla Completa
        </button>
      </div>
    </div>

    <div class="viewer-container" id="viewerContainer">
      <iframe id="diagramFrame" src="01_arquitectura_sistema.html" title="Visualizador de Diagramas Técnicos"></iframe>
    </div>
  </main>

  <script>
    const diagrams = [
      {
        title: "01. Arquitectura Global C4 Contenedores",
        badge: "Architecture",
        badgeClass: "badge-arch",
        desc: "Red Docker 'bevadmin-network', Spring Boot 4, Angular 21 y PostgreSQL 17.",
        url: "01_arquitectura_sistema.html"
      },
      {
        title: "02. Secuencia: Emisión de Venta POS y Cupones",
        badge: "Sequence",
        badgeClass: "badge-seq",
        desc: "Persistencia ACID en ventas y detalles_venta, validación de cupones y correlativos.",
        url: "02_secuencia_emision_venta.html"
      },
      {
        title: "03. Secuencia: Auditoría NOC y Kill Session",
        badge: "Sequence",
        badgeClass: "badge-seq",
        desc: "Monitoreo en vivo con semáforo unificado, filtro de conexión y cierre forzoso remoto.",
        url: "03_secuencia_monitoreo_sesiones.html"
      },
      {
        title: "04. Secuencia: Menú Dinámico y RBAC Jerárquico",
        badge: "Sequence",
        badgeClass: "badge-seq",
        desc: "Función CTE fn_obtener_menu_efectivo_usuario y sanitización de submenús vacíos.",
        url: "04_secuencia_menu_dinamico_rbac.html"
      },
      {
        title: "05. Flujo Operativo End-to-End (Workflow)",
        badge: "Workflow Trace",
        badgeClass: "badge-flow",
        desc: "Ciclo integral interactivo animado: Apertura -> POS -> Comprobante -> Cierre de Caja.",
        url: "05_flujo_operativo_negocio.html"
      },
      {
        title: "06. Modelo de Datos Relacional ERD en Español",
        badge: "PostgreSQL 17 ERD",
        badgeClass: "badge-erd",
        desc: "19 tablas con nombres en español estructuradas en 4 dominios con claves foráneas.",
        url: "06_modelo_datos_erd.html"
      },
      {
        title: "07. Modelo C4: Interconexión Operaciones (Ops), Frontend, Backend y BD",
        badge: "C4 Model Nivel 2",
        badgeClass: "badge-arch",
        desc: "Segmentación en 3 redes aisladas (bevadmin-ops-network, bevadmin-app-network y bevadmin-data-network) con Traefik TLS 1.3, CrowdSec, Databasus y PostgreSQL.",
        url: "07_c4_interconexion_ops_aplicaciones.html"
      },
      {
        title: "08. Modelo C4: Pipeline CI/CD con GitHub Actions para Homelab",
        badge: "C4 Model Nivel 2",
        badgeClass: "badge-arch",
        desc: "Integración Continua (CI) en GitHub Cloud y Despliegue Continuo (CD) Seguro Pull-Based mediante Self-Hosted Runner en Homelab On-Premise.",
        url: "08_c4_pipeline_cicd_homelab.html"
      }
    ];

    let currentIndex = 0;

    function selectDiagram(index) {
      currentIndex = index;
      const data = diagrams[index];

      // Update frame source immediately in the same tab
      const frame = document.getElementById('diagramFrame');
      frame.src = data.url;

      // Update toolbar info
      document.getElementById('currentTitle').innerText = data.title;
      document.getElementById('currentDesc').innerText = data.desc;
      const badge = document.getElementById('currentBadge');
      badge.innerText = data.badge;
      badge.className = `item-badge ${data.badgeClass}`;

      // Update active list item
      const buttons = document.querySelectorAll('.diagram-item');
      buttons.forEach((btn, idx) => {
        if (idx === index) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
      });

      // Close mobile sidebar if open
      document.getElementById('sidebar').classList.remove('open');
    }

    function reloadFrame() {
      const frame = document.getElementById('diagramFrame');
      frame.src = frame.src;
    }

    function toggleFullscreen() {
      const container = document.getElementById('viewerContainer');
      const icon = document.getElementById('fsIcon');
      if (!document.fullscreenElement) {
        container.requestFullscreen().then(() => {
          icon.className = 'bi bi-fullscreen-exit';
        }).catch(err => console.error(err));
      } else {
        document.exitFullscreen().then(() => {
          icon.className = 'bi bi-fullscreen';
        }).catch(err => console.error(err));
      }
    }

    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('open');
    }

    // Keyboard navigation: 1-8 or arrows
    window.addEventListener('keydown', (e) => {
      if (e.key >= '1' && e.key <= '8') {
        selectDiagram(parseInt(e.key) - 1);
      } else if (e.key === 'ArrowDown') {
        selectDiagram((currentIndex + 1) % diagrams.length);
      } else if (e.key === 'ArrowUp') {
        selectDiagram((currentIndex - 1 + diagrams.length) % diagrams.length);
      }
    });
  </script>
</body>
</html>
